<?xml version="1.0" encoding="UTF-8"?>
<!-- ==========================================================================
     hero.svg  —  hero illustration
     An abstract "performance review" scene drawn in the brand palette, so the
     page ships with no stock-photo licence attached and stays sharp on any
     screen. To use a real photograph instead, drop it in this folder and point
     the <img class="hero__image"> in index.html at it (see README).
     The colours below are the same hex values as the CSS tokens.
     ========================================================================== -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="hero-svg-title">
  <title id="hero-svg-title">Business performance dashboard with a growth trend and quarterly figures</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#dfe9f6"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f7fd1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2f7fd1" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="deepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123255"/>
      <stop offset="100%" stop-color="#0d2340"/>
    </linearGradient>
    <filter id="cardShadow" x="-12%" y="-12%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0d2340" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d2340" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="720" height="560" rx="28" fill="url(#bgGrad)"/>
  <circle cx="640" cy="86" r="150" fill="#2f7fd1" opacity="0.07"/>
  <circle cx="86" cy="500" r="110" fill="#0d2340" opacity="0.05"/>

  <!-- Main dashboard card -->
  <g filter="url(#cardShadow)">
    <rect x="64" y="96" width="470" height="330" rx="18" fill="#ffffff"/>
  </g>

  <!-- Card header -->
  <rect x="94" y="128" width="150" height="12" rx="6" fill="#123255" opacity="0.85"/>
  <rect x="94" y="150" width="96" height="9" rx="4.5" fill="#55657a" opacity="0.45"/>
  <rect x="430" y="128" width="74" height="26" rx="13" fill="#e8f1fb"/>
  <text x="467" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2467ab" text-anchor="middle">FY 2026</text>

  <!-- Grid lines -->
  <g stroke="#dfe5ec" stroke-width="1">
    <line x1="94" y1="200" x2="504" y2="200"/>
    <line x1="94" y1="248" x2="504" y2="248"/>
    <line x1="94" y1="296" x2="504" y2="296"/>
    <line x1="94" y1="344" x2="504" y2="344"/>
  </g>

  <!-- Trend area + line -->
  <path d="M94 330 L162 306 L230 316 L298 262 L366 240 L434 206 L504 178 L504 344 L94 344 Z" fill="url(#areaGrad)"/>
  <path d="M94 330 L162 306 L230 316 L298 262 L366 240 L434 206 L504 178"
        fill="none" stroke="#2f7fd1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <g fill="#ffffff" stroke="#2f7fd1" stroke-width="3">
    <circle cx="162" cy="306" r="5"/>
    <circle cx="298" cy="262" r="5"/>
    <circle cx="434" cy="206" r="5"/>
  </g>
  <circle cx="504" cy="178" r="7.5" fill="#c8a349" stroke="#ffffff" stroke-width="3"/>

  <!-- X-axis labels -->
  <g fill="#55657a" opacity="0.5">
    <rect x="94" y="366" width="34" height="8" rx="4"/>
    <rect x="162" y="366" width="34" height="8" rx="4"/>
    <rect x="230" y="366" width="34" height="8" rx="4"/>
    <rect x="298" y="366" width="34" height="8" rx="4"/>
    <rect x="366" y="366" width="34" height="8" rx="4"/>
    <rect x="434" y="366" width="34" height="8" rx="4"/>
  </g>

  <!-- Bar-chart card (top right, overlapping) -->
  <g filter="url(#softShadow)">
    <rect x="464" y="52" width="196" height="168" rx="16" fill="#ffffff"/>
  </g>
  <rect x="488" y="78" width="86" height="10" rx="5" fill="#123255" opacity="0.8"/>
  <g fill="#cfe0f3">
    <rect x="488" y="150" width="18" height="42" rx="5"/>
    <rect x="518" y="132" width="18" height="60" rx="5"/>
    <rect x="548" y="142" width="18" height="50" rx="5"/>
    <rect x="578" y="114" width="18" height="78" rx="5"/>
  </g>
  <rect x="608" y="100" width="18" height="92" rx="5" fill="#2f7fd1"/>

  <!-- KPI card (bottom left) -->
  <g filter="url(#softShadow)">
    <rect x="40" y="382" width="240" height="112" rx="16" fill="url(#deepGrad)"/>
  </g>
  <text x="68" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">+38%</text>
  <rect x="68" y="444" width="132" height="9" rx="4.5" fill="#a9bdd4" opacity="0.7"/>
  <rect x="68" y="461" width="84" height="9" rx="4.5" fill="#a9bdd4" opacity="0.45"/>
  <path d="M228 442 l14 -16 l14 16" fill="none" stroke="#c8a349" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="242" y1="426" x2="242" y2="462" stroke="#c8a349" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Checklist card (bottom right) -->
  <g filter="url(#softShadow)">
    <rect x="404" y="404" width="272" height="112" rx="16" fill="#ffffff"/>
  </g>
  <g>
    <circle cx="436" cy="438" r="11" fill="#e8f1fb"/>
    <path d="M431 438 l4 4 l7 -8" fill="none" stroke="#2467ab" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="458" y="433" width="150" height="9" rx="4.5" fill="#55657a" opacity="0.45"/>
  </g>
  <g>
    <circle cx="436" cy="478" r="11" fill="#e8f1fb"/>
    <path d="M431 478 l4 4 l7 -8" fill="none" stroke="#2467ab" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="458" y="473" width="112" height="9" rx="4.5" fill="#55657a" opacity="0.45"/>
  </g>
</svg>
